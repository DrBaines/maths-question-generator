<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maths Question Creator</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;text-align:center;padding:28px 16px}.hero h1{margin:0 0 8px;font-size:2rem}.hero p{margin:0}.page{max-width:1200px;margin:22px auto;padding:0 16px 40px}.panel,.category-card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(15,23,42,.08);margin-bottom:18px}.panel-heading{display:flex;justify-content:space-between;gap:12px;align-items:start}.selection-count{font-weight:800;background:#dbeafe;color:#1d4ed8;padding:10px 14px;border-radius:999px;white-space:nowrap}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#2563eb;color:white}.primary:hover{background:#1d4ed8}.secondary{background:#e5e7eb;color:#1f2937}.secondary:hover{background:#d1d5db}.success{background:#16a34a;color:white}.skill-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.category-card h3{margin:0 0 12px}.skill-list{display:flex;flex-wrap:wrap;gap:8px}.skill-toggle{border:2px solid #d1d5db;background:white;color:#1f2937;border-radius:14px;padding:10px 12px;text-align:left}.skill-toggle.selected{background:#2563eb;color:white;border-color:#1d4ed8}.skill-toggle.selected::before{content:'✓ ';font-weight:900}.questions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.question-card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px rgba(15,23,42,.07)}.question-number{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:900;margin-bottom:10px}.question-skill{font-size:.78rem;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;font-weight:800;margin-bottom:8px}.question-text{font-size:1.28rem;line-height:1.35;margin-bottom:14px}.answer{display:none;background:#ecfdf5;border:2px dashed #86efac;color:#166534;border-radius:12px;padding:10px;font-size:1.1rem;font-weight:900}.answer.visible{display:block}.card-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.card-controls button{font-size:.85rem;padding:8px 12px}.empty-message,.error-message{text-align:center;padding:28px;color:#6b7280}.error-message{color:#b91c1c;font-weight:800}@media print{@page{size:A4 landscape;margin:10mm}body{background:white}.hero,.page{display:none!important}#printArea{display:block!important}.print-page{page-break-after:always;break-after:page;width:100%;height:180mm;padding:0}.print-page:last-child{page-break-after:auto;break-after:auto}.print-title{text-align:center;font-size:18pt;margin:0 0 6mm;font-weight:900}.print-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5mm;height:155mm}.print-card{border:2px solid #111;border-radius:8px;padding:5mm;break-inside:avoid;display:flex;flex-direction:column}.print-number{font-weight:900;font-size:14pt;margin-bottom:3mm}.print-question{font-size:15pt;line-height:1.25;flex:1}.print-answer{font-size:13pt;font-weight:900;margin-top:4mm;border-top:1px dashed #555;padding-top:3mm}}@media screen{#printArea{display:none}}
  </style>
</head>
<body>
  <header class="hero"><h1>Maths Question Creator</h1><p>Choose skills, generate questions, then reveal the answers when ready.</p></header>
  <main class="page">
    <section class="panel">
      <div class="panel-heading"><div><h2>1. Choose skills</h2><p>Click a skill to turn it on or off. Selected skills are blue.</p></div><div id="selectionCount" class="selection-count">0 selected</div></div>
      <div class="controls">
        <button id="selectAllBtn" class="secondary" type="button">Select All</button>
        <button id="clearAllBtn" class="secondary" type="button">Clear All</button>
        <button id="generateBtn" class="primary" type="button">Generate 8 Questions</button>
        <button id="hideAnswersBtn" class="secondary" type="button">Hide Answers</button>
        <button id="showAnswersBtn" class="success" type="button">Reveal Answers</button>
        <button id="printBtn" class="secondary" type="button">Print Questions + Answers</button>
      </div>
    </section>
    <section id="skillGroups" class="skill-groups"></section>
    <section class="panel"><h2>2. Questions</h2><div id="questions" class="questions"><div class="empty-message">Select at least one skill, then click <strong>Generate 8 Questions</strong>.</div></div></section>
  </main>
<script>
(function(){
  var groups = [
    {category:'Number and Place Value',skills:[
      skill('more-less','10, 100 or 1000 more or less',function(){var amount=pick([10,100,1000]),type=pick(['more','less']),n= type==='more' ? rand(1000,8999) : rand(1000+amount,9999),ans= type==='more' ? n+amount : n-amount;return qa('What is '+amount+' '+type+' than '+n+'?',ans)}),
      skill('digit-value','Value of a digit',function(){var n=rand(1000,9999),str=String(n),i=rand(0,3),v=Number(str.charAt(i))*Math.pow(10,3-i);return qa('What is the value of the digit '+str.charAt(i)+' in '+n+'?',v)}),
      skill('order-numbers','Order numbers',function(){var nums=uniqueNumbers(4,1000,9999),dir=pick(['ascending','descending']),ordered=nums.slice().sort(function(a,b){return dir==='ascending'?a-b:b-a});return qa('Put these numbers in '+dir+' order: '+nums.join(', '),ordered.join(', '))}),
      skill('rounding','Round to 10, 100 or 1000',function(){var n=rand(1000,9999),nearest=pick([10,100,1000]);return qa('Round '+n+' to the nearest '+nearest+'.',Math.round(n/nearest)*nearest)}),
      skill('negative','Negative numbers',function(){var a=rand(-10,5),b=rand(2,8);return qa(a+' + '+b+' = ?',a+b)}),
      skill('roman','Roman numerals to 100',function(){var n=rand(1,100),r=toRoman(n);if(Math.random()<0.5){return qa('Write '+n+' in Roman numerals.',r)}return qa('Convert '+r+' to a number.',n)})]},
    {category:'Addition and Subtraction',skills:[
      skill('add-4','Add 4-digit numbers',function(){var a=rand(1000,8999),b=rand(1000,8999);return qa(a+' + '+b+' = ?',a+b)}),
      skill('sub-4','Subtract 4-digit numbers',function(){var a=rand(3000,9999),b=rand(1000,a-1);return qa(a+' − '+b+' = ?',a-b)}),
      skill('inverse','Inverse operations',function(){var a=rand(100,900),b=rand(100,900);return qa(a+' + ___ = '+(a+b),b)}),
      skill('estimate','Estimate answers',function(){var a=rand(1000,9999),b=rand(1000,9999);return qa('Estimate '+a+' + '+b+' by rounding both to the nearest 100.',Math.round(a/100)*100+Math.round(b/100)*100)})]},
    {category:'Multiplication and Division',skills:[
      skill('tables','Times tables to 12 × 12',function(){var a=rand(2,12),b=rand(2,12);return qa(a+' × '+b+' = ?',a*b)}),
      skill('division-facts','Division facts',function(){var b=rand(2,12),ans=rand(2,12);return qa((b*ans)+' ÷ '+b+' = ?',ans)}),
      skill('three-numbers','Multiply three numbers',function(){var a=rand(2,6),b=rand(2,6),c=rand(2,6);return qa(a+' × '+b+' × '+c+' = ?',a*b*c)}),
      skill('factor-pairs','Factor pairs',function(){var a=rand(2,10),b=rand(2,10);return qa('Give one factor pair of '+(a*b)+'.',a+' and '+b)}),
      skill('multiply-10-100','Multiply by 10 or 100',function(){var n=rand(2,99),m=pick([10,100]);return qa(n+' × '+m+' = ?',n*m)}),
      skill('remainders','Division with remainders',function(){var d=rand(2,9),q=rand(4,12),r=rand(1,d-1);return qa((d*q+r)+' ÷ '+d+' = ?',q+' r '+r)})]},
    {category:'Fractions and Decimals',skills:[
      skill('equiv-frac','Equivalent fractions',function(){var d=rand(3,10),n=rand(1,d-1),m=rand(2,5);return qa('Write an equivalent fraction to '+n+'/'+d+'.',(n*m)+'/'+(d*m))}),
      skill('add-frac','Add fractions with same denominator',function(){var d=rand(5,12),a=rand(1,d-2),b=rand(1,d-a-1);return qa(a+'/'+d+' + '+b+'/'+d+' = ?',(a+b)+'/'+d)}),
      skill('sub-frac','Subtract fractions with same denominator',function(){var d=rand(5,12),a=rand(2,d-1),b=rand(1,a-1);return qa(a+'/'+d+' − '+b+'/'+d+' = ?',(a-b)+'/'+d)}),
      skill('hundredths','Hundredths as decimals',function(){var n=rand(1,99);return qa('Write '+n+'/100 as a decimal.',(n/100).toFixed(2))}),
      skill('divide-10-100','Divide by 10 or 100',function(){var n=rand(100,9900),d=pick([10,100]);return qa(n+' ÷ '+d+' = ?',fmt(n/d))}),
      skill('round-decimals','Round decimals',function(){var n=(rand(11,999)/10).toFixed(1);return qa('Round '+n+' to the nearest whole number.',Math.round(Number(n)))})]},
    {category:'Measurement',skills:[
      skill('length','Convert lengths',function(){var m=rand(1,9);return qa(m+' m = ___ cm',m*100)}),
      skill('money','Pounds and pence',function(){var p=rand(105,999);return qa(p+'p = £___',(p/100).toFixed(2))}),
      skill('perimeter','Perimeter of rectangles',function(){var l=rand(4,20),w=rand(3,15);return qa('A rectangle is '+l+' cm by '+w+' cm. What is its perimeter?',(2*(l+w))+' cm')}),
      skill('area','Area of rectangles',function(){var l=rand(3,12),w=rand(3,12);return qa('A rectangle is '+l+' squares by '+w+' squares. What is its area?',(l*w)+' square units')}),
      skill('time','24-hour time',function(){var h=rand(13,23),m=pick(['00','15','30','45']);return qa('Write '+h+':'+m+' in 12-hour time.',(h-12)+':'+m+' pm')})]},
    {category:'Geometry and Statistics',skills:[
      skill('angles','Compare angles',function(){var a=rand(20,160);return qa('Is '+a+'° acute, right angle or obtuse?',a<90?'acute':a===90?'right angle':'obtuse')}),
      skill('symmetry','Lines of symmetry',function(){var item=pick([{s:'square',a:4},{s:'rectangle',a:2},{s:'equilateral triangle',a:3},{s:'regular pentagon',a:5}]);return qa('How many lines of symmetry does a '+item.s+' have?',item.a)}),
      skill('coords','Coordinates',function(){var x=rand(0,10),y=rand(0,10);return qa('A point is '+x+' across and '+y+' up. Write its coordinates.','('+x+', '+y+')')}),
      skill('data','Interpret data',function(){var a=rand(10,40),b=rand(10,40);return qa('Class A scored '+a+' points and Class B scored '+b+' points. How many points altogether?',a+b)}),
      skill('difference','Find the difference',function(){var a=rand(5,30),b=rand(a+1,50);return qa('A temperature changed from '+a+'°C to '+b+'°C. What was the increase?',(b-a)+'°C')})]}
  ];
  var selected = {}; var current = [];
  function init(){renderSkills();selectAll();id('selectAllBtn').onclick=selectAll;id('clearAllBtn').onclick=clearAll;id('generateBtn').onclick=generate;id('showAnswersBtn').onclick=function(){answers(true)};id('hideAnswersBtn').onclick=function(){answers(false)};id('printBtn').onclick=printSheets;}
  function renderSkills(){var html='';groups.forEach(function(g){html+='<section class="category-card"><h3>'+esc(g.category)+'</h3><div class="skill-list">';g.skills.forEach(function(s){html+='<button type="button" class="skill-toggle" data-id="'+esc(s.id)+'">'+esc(s.name)+'</button>';});html+='</div></section>';});id('skillGroups').innerHTML=html;var buttons=document.querySelectorAll('.skill-toggle');for(var i=0;i<buttons.length;i++){buttons[i].onclick=function(){var sid=this.getAttribute('data-id');selected[sid]=!selected[sid];updateButtons();};}}
  function selectAll(){allSkills().forEach(function(s){selected[s.id]=true});updateButtons();}
  function clearAll(){selected={};updateButtons();}
  function updateButtons(){var count=0,buttons=document.querySelectorAll('.skill-toggle');for(var i=0;i<buttons.length;i++){var sid=buttons[i].getAttribute('data-id'),on=!!selected[sid];if(on)count++;buttons[i].className=on?'skill-toggle selected':'skill-toggle';}id('selectionCount').innerHTML=count+' selected';}
  function generate(){var chosen=allSkills().filter(function(s){return !!selected[s.id]});if(chosen.length===0){id('questions').innerHTML='<div class="error-message">Please select at least one skill first.</div>';return;}current=[];for(var i=0;i<8;i++)current.push(makeQ(i,chosen));renderQuestions();}
  function makeQ(i,chosen){var s=pick(chosen),q=s.create();return {number:i+1,skill:s.name,question:q.question,answer:q.answer,visible:false};}
  function renderQuestions(){var html='';current.forEach(function(q,i){html+='<article class="question-card"><div><div class="question-number">'+q.number+'</div><div class="question-skill">'+esc(q.skill)+'</div><div class="question-text">'+esc(q.question)+'</div><div class="answer '+(q.visible?'visible':'')+'">Answer: '+esc(q.answer)+'</div></div><div class="card-controls"><button type="button" class="primary" data-action="reveal" data-index="'+i+'">'+(q.visible?'Hide':'Reveal')+' Answer</button><button type="button" class="secondary" data-action="new" data-index="'+i+'">New Question</button></div></article>';});id('questions').innerHTML=html;var buttons=id('questions').querySelectorAll('button');for(var j=0;j<buttons.length;j++){buttons[j].onclick=function(){var ix=Number(this.getAttribute('data-index'));if(this.getAttribute('data-action')==='reveal'){current[ix].visible=!current[ix].visible;}else{var chosen=allSkills().filter(function(s){return !!selected[s.id]});current[ix]=makeQ(ix,chosen);}renderQuestions();};}}
  function printSheets(){
    if(!current.length){generate();}
    var area=id('printArea');
    var qCards='', aCards='';
    for(var i=0;i<current.length;i++){
      var q=current[i];
      qCards+='<div class="print-card"><div class="print-number">'+q.number+'</div><div class="print-question">'+esc(q.question)+'</div></div>';
      aCards+='<div class="print-card"><div class="print-number">'+q.number+'</div><div class="print-question">'+esc(q.question)+'</div><div class="print-answer">Answer: '+esc(q.answer)+'</div></div>';
    }
    area.innerHTML='<section class="print-page"><h1 class="print-title">Questions</h1><div class="print-grid">'+qCards+'</div></section><section class="print-page"><h1 class="print-title">Questions with Answers</h1><div class="print-grid">'+aCards+'</div></section>';
    window.print();
  }
  function answers(show){for(var i=0;i<current.length;i++)current[i].visible=show;if(current.length)renderQuestions();}
  function allSkills(){var out=[];groups.forEach(function(g){g.skills.forEach(function(s){out.push(s)})});return out;}
  function skill(id,name,create){return {id:id,name:name,create:create};} function qa(q,a){return {question:q,answer:String(a)}} function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min} function pick(arr){return arr[rand(0,arr.length-1)]} function uniqueNumbers(count,min,max){var o=[];while(o.length<count){var n=rand(min,max);if(o.indexOf(n)===-1)o.push(n)}return o} function fmt(v){return Math.round(v)===v?String(v):String(Number(v.toFixed(2)))}
  function toRoman(num){var map=[['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]],r='';for(var i=0;i<map.length;i++){while(num>=map[i][1]){r+=map[i][0];num-=map[i][1];}}return r;}
  function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')} function id(x){return document.getElementById(x)}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();
</script>
<div id="printArea" aria-hidden="true"></div>
</body>
</html>
