<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Question Creator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;text-align:center;padding:28px 16px}
.hero h1{margin:0 0 8px;font-size:2rem}
.page{max-width:1200px;margin:22px auto;padding:0 16px 40px}
.panel,.category-card{background:white;border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(15,23,42,.08);margin-bottom:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:#2563eb;color:white}
.secondary{background:#e5e7eb}
.success{background:#16a34a;color:white}
.skill-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.skill-list{display:flex;flex-wrap:wrap;gap:8px}
.skill-toggle{border:2px solid #d1d5db;background:white;border-radius:14px;padding:10px 12px}
.skill-toggle.selected{background:#2563eb;color:white}
.questions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.question-card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.question-number{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:900;margin-bottom:10px}
.question-text{font-size:1.25rem;line-height:1.4}
.answer{display:none;background:#ecfdf5;border:2px dashed #86efac;padding:10px;border-radius:12px;font-weight:800;margin-top:10px}
.answer.visible{display:block}
.card-controls{display:flex;gap:8px;margin-top:12px}
@media print{
.hero,.panel:first-of-type,#skillGroups,.card-controls{display:none!important}
body{background:white}
.page{max-width:none;margin:0;padding:0}
.questions{grid-template-columns:repeat(2,1fr);gap:10px}
.question-card{break-inside:avoid;box-shadow:none;min-height:45vh}
.print-answer-sheet .answer{display:block!important}
.print-answer-sheet .question-card{min-height:45vh}
}
</style>
</head>
<body>
<header class="hero">
<h1>Maths Question Creator</h1>
<p>Create printable maths question sets</p>
</header>

<main class="page">
<section class="panel">
<h2>Choose skills</h2>
<div class="controls">
<button id="selectAllBtn" class="secondary">Select All</button>
<button id="clearAllBtn" class="secondary">Clear All</button>
<button id="generateBtn" class="primary">Generate 8 Questions</button>
<button id="hideAnswersBtn" class="secondary">Hide Answers</button>
<button id="showAnswersBtn" class="success">Reveal Answers</button>
<button id="printBtn" class="secondary">Print Questions + Answers</button>
</div>
</section>

<section id="skillGroups" class="skill-groups"></section>

<section class="panel">
<div id="questions" class="questions"></div>
</section>
</main>

<script>
(function(){
const groups=[
{category:'Number and Place Value',skills:[
skill('more-less','10 100 or 1000 more or less',()=>{
const n=rand(1000,9999);
const amount=pick([10,100,1000]);
const type=pick(['more','less']);
const ans=type==='more'?n+amount:n-amount;
return qa(`What is ${amount} ${type} than ${n}?`,ans);
}),
skill('order','Order numbers',()=>{
const nums=unique(4,1000,9999);
const dir=pick(['ascending','descending']);
const sorted=nums.slice().sort((a,b)=>dir==='ascending'?a-b:b-a);
return qa(`Put these numbers in ${dir} order:<br>${nums.join(', ')}`,sorted.join(', '));
}),
skill('roman','Roman numerals',()=>{
const n=rand(1,100);
if(Math.random()<0.5){
return qa(`Write ${n} in Roman numerals.`,toRoman(n));
}else{
const r=toRoman(n);
return qa(`Convert ${r} to a number.`,n);
}
})
]}
];

let selected={};
let current=[];

function init(){
renderSkills();
selectAll();

id('selectAllBtn').onclick=selectAll;
id('clearAllBtn').onclick=clearAll;
id('generateBtn').onclick=generate;
id('showAnswersBtn').onclick=()=>toggleAnswers(true);
id('hideAnswersBtn').onclick=()=>toggleAnswers(false);
id('printBtn').onclick=printSheets;
}

function renderSkills(){
let html='';
groups.forEach(g=>{
html+=`<section class="category-card"><h3>${g.category}</h3><div class="skill-list">`;
g.skills.forEach(s=>{
html+=`<button class="skill-toggle" data-id="${s.id}">${s.name}</button>`;
});
html+='</div></section>';
});
id('skillGroups').innerHTML=html;

document.querySelectorAll('.skill-toggle').forEach(btn=>{
btn.onclick=()=>{
const sid=btn.dataset.id;
selected[sid]=!selected[sid];
updateButtons();
};
});
}

function selectAll(){
allSkills().forEach(s=>selected[s.id]=true);
updateButtons();
}

function clearAll(){
selected={};
updateButtons();
}

function updateButtons(){
document.querySelectorAll('.skill-toggle').forEach(btn=>{
btn.classList.toggle('selected',!!selected[btn.dataset.id]);
});
}

function generate(){
const chosen=allSkills().filter(s=>selected[s.id]);
current=[];
for(let i=0;i<8;i++){
const s=pick(chosen);
const q=s.create();
current.push({number:i+1,skill:s.name,question:q.question,answer:q.answer,visible:false});
}
renderQuestions();
}

function renderQuestions(){
id('questions').innerHTML=current.map((q,i)=>`
<article class="question-card">
<div>
<div class="question-number">${q.number}</div>
<div class="question-text">${q.question}</div>
<div class="answer ${q.visible?'visible':''}">Answer: ${q.answer}</div>
</div>
<div class="card-controls">
<button class="primary reveal-btn" data-i="${i}">${q.visible?'Hide':'Reveal'} Answer</button>
</div>
</article>
`).join('');

document.querySelectorAll('.reveal-btn').forEach(btn=>{
btn.onclick=()=>{
const i=Number(btn.dataset.i);
current[i].visible=!current[i].visible;
renderQuestions();
};
});
}

function toggleAnswers(show){
current.forEach(q=>q.visible=show);
renderQuestions();
}

function printSheets(){
document.body.classList.remove('print-answer-sheet');
window.print();

setTimeout(()=>{
document.body.classList.add('print-answer-sheet');
window.print();
document.body.classList.remove('print-answer-sheet');
},500);
}

function skill(id,name,create){return{id,name,create}}
function qa(question,answer){return{question,answer}}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[rand(0,arr.length-1)]}
function allSkills(){return groups.flatMap(g=>g.skills)}
function unique(count,min,max){
const arr=[];
while(arr.length<count){
const n=rand(min,max);
if(!arr.includes(n))arr.push(n);
}
return arr;
}
function id(x){return document.getElementById(x)}

function toRoman(num){
const map=[['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
let out='';
map.forEach(([r,v])=>{
while(num>=v){out+=r;num-=v;}
});
return out;
}

init();
})();
</script>
</body>
</html>
