<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maths Question Creator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>Maths Question Creator</h1>
    <p>Select skills, generate questions, then reveal answers when ready.</p>
  </header>

  <main>
    <section class="panel chooser">
      <div class="section-heading">
        <div>
          <h2>1. Choose skills</h2>
          <p>Click a skill to toggle it on or off. Selected skills turn blue.</p>
        </div>
        <div id="selectedCount" class="selected-count">Loading skills…</div>
      </div>

      <div class="controls small-controls">
        <button type="button" id="selectAllBtn" class="secondary">Select All</button>
        <button type="button" id="clearAllBtn" class="secondary">Clear All</button>
      </div>

      <div id="skills" class="skills-wrapper"></div>

      <div class="controls main-controls">
        <button type="button" id="generateBtn">Generate 8 Questions</button>
        <button type="button" id="revealAllBtn" class="success">Reveal All Answers</button>
        <button type="button" id="hideAllBtn" class="secondary">Hide All Answers</button>
        <button type="button" id="printBtn" class="secondary">Print Questions</button>
      </div>
    </section>

    <section id="questions" class="questions">
      <div class="panel empty">Choose at least one skill, then click Generate 8 Questions.</div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
