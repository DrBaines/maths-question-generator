<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maths Question Creator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header class="hero">
    <h1>Maths Question Creator</h1>
    <p>Choose skills, generate questions, then reveal the answers when you are ready.</p>
  </header>

  <main class="page">
    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>1. Choose skills</h2>
          <p>Click a skill to turn it on or off. Selected skills are highlighted blue.</p>
        </div>
        <div class="selection-count" id="selectionCount">0 selected</div>
      </div>

      <div class="controls">
        <button id="selectAllBtn" type="button" class="secondary">Select All</button>
        <button id="clearAllBtn" type="button" class="secondary">Clear All</button>
        <button id="generateBtn" type="button" class="primary">Generate 8 Questions</button>
        <button id="hideAnswersBtn" type="button" class="secondary">Hide Answers</button>
        <button id="showAnswersBtn" type="button" class="success">Reveal Answers</button>
        <button id="printBtn" type="button" class="secondary">Print</button>
      </div>
    </section>

    <section id="skillGroups" class="skill-groups" aria-label="Skill choices"></section>

    <section class="panel">
      <h2>2. Questions</h2>
      <div id="questions" class="questions">
        <div class="empty-message">Select at least one skill, then click <strong>Generate 8 Questions</strong>.</div>
      </div>
    </section>
  </main>
</body>
</html>
